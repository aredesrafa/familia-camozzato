# Site estático: sem funções nem adaptador, para ficar no plano Free.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# O painel do CMS não deve aparecer em buscadores.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Endereços do site antigo (FrontPage) → novas páginas.
# Só passam a valer quando o domínio familiacamozzato.com.br apontar para o Netlify.
[[redirects]]
  from = "/pagina_principal.htm"
  to = "/"
  status = 301
[[redirects]]
  from = "/destaques.htm"
  to = "/historias/"
  status = 301
[[redirects]]
  from = "/cidades_importantes/cidades_importantes.htm"
  to = "/cidades/"
  status = 301
[[redirects]]
  from = "/cidades_importantes/montebelluna.htm"
  to = "/cidades/montebelluna/"
  status = 301
[[redirects]]
  from = "/cidades_importantes/antonioprado.htm"
