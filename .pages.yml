# Configuração do Pages CMS (https://pagescms.org).
# Cada item de "content" corresponde a uma coleção em src/content.config.ts.
# Ao mudar um campo aqui, mude também lá (e vice-versa).

# Botão "Publicar site": as alterações ficam salvas como rascunho na branch `conteudo`
# e só vão para o site no ar quando alguém clica aqui (.github/workflows/publicar.yml).
actions:
  - name: publicar
    label: Publicar site
    workflow: publicar.yml
    ref: main
    cancelable: false
    confirm:
      title: Publicar o site?
      message: "Todas as alterações salvas até agora vão para o site no ar em cerca de 2 minutos. Antes, confira a prévia em conteudo-familia-camozzato.infinitybuilder.workers.dev"
      button: Publicar

media:
  input: public/img
  output: /img
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: home
    label: Página inicial
    type: file
    path: src/data/home.json
    format: json
    fields:
      - { name: hero_titulo, label: Título principal, type: string, required: true }
      - { name: hero_texto, label: Texto de abertura, type: text, required: true }
      - { name: hero_imagem, label: Foto principal, type: image, required: true }
      - { name: hero_imagem_alt, label: Descrição da foto, type: text, description: "Para quem usa leitor de tela. Descreva o que aparece na foto." }
      - { name: hero_legenda, label: Legenda da foto, type: string }
      - name: numeros
        label: Números
        type: object
        list: true
        fields:
          - { name: valor, label: Valor, type: string }
          - { name: rotulo, label: Descrição, type: string }
      - { name: arvore_titulo, label: Árvore — título, type: string }
      - { name: arvore_texto, label: Árvore — texto, type: text }
      - { name: livro_titulo, label: Livro — título, type: string }
      - { name: livro_texto, label: Livro — texto, type: text }
      - { name: livro_capa, label: Livro — capa, type: image }
      - { name: contribua_titulo, label: Contribua — título, type: string }
      - { name: contribua_texto, label: Contribua — texto, type: text }
      - { name: email, label: E-mail de contato, type: string }

  - name: historias
    label: Histórias
    type: collection
    path: src/content/historias
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [titulo, pessoa, destaque]
      primary: titulo
      sort: [ordem, titulo]
      default: { sort: ordem, order: asc }
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: pessoa, label: Pessoa, type: string }
      - { name: periodo, label: Data ou período, type: string, description: "Ex.: 1904 – 1908, ou Sananduva" }
      - { name: resumo, label: Resumo, type: text, required: true, description: "Aparece nos cartões da página inicial e da lista de histórias." }
      - { name: imagem, label: Imagem, type: image }
      - { name: imagem_alt, label: Descrição da imagem, type: text }
      - { name: ordem, label: Ordem, type: number, default: 99 }
      - { name: destaque, label: Mostrar na página inicial, type: boolean, default: false }
      - { name: body, label: Texto, type: rich-text, options: { format: markdown } }

  - name: cidades
    label: Lugares
    type: collection
    path: src/content/cidades
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [nome, regiao]
      primary: nome
      sort: [ordem, nome]
      default: { sort: ordem, order: asc }
    fields:
      - { name: nome, label: Nome, type: string, required: true }
      - { name: regiao, label: Estado ou país, type: string, required: true }
      - { name: ordem, label: Ordem, type: number, default: 99 }
      - { name: resumo, label: Resumo, type: text, required: true }
      - { name: imagem, label: Imagem, type: image }
      - { name: imagem_alt, label: Descrição da imagem, type: text }
      - { name: body, label: Texto, type: rich-text, options: { format: markdown } }

  - name: nucleos
    label: Núcleos imigrantes
    type: collection
    path: src/content/nucleos
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [titulo, lugares]
      primary: titulo
      sort: [ordem, titulo]
      default: { sort: ordem, order: asc }
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: lugares, label: Lugares, type: string, required: true }
      - { name: grafia, label: Grafia do sobrenome (se diferente), type: string }
      - { name: ordem, label: Ordem, type: number, default: 99 }
      - { name: raiz, label: Casal de origem, type: string, required: true }
      - { name: body, label: Texto, type: text }

  - name: marcos
    label: Linha do tempo
    type: collection
    path: src/content/marcos
    format: yaml
    filename:
      template: "{ano}-{primary}.yml"
      field: create
    view:
      fields: [data, titulo, home]
      primary: titulo
      sort: [ano, titulo]
      default: { sort: ano, order: asc }
    fields:
      - { name: ano, label: Ano, type: number, required: true }
      - { name: mes, label: Mês, type: number, options: { min: 1, max: 12 }, description: "Opcional. Usado só para ordenar marcos do mesmo ano (1 a 12)." }
      - { name: data, label: Data como aparece no site, type: string, required: true, description: "Ex.: 12 jan 1880, c. 1915, 1888 – 1889" }
      - { name: titulo, label: Título, type: string, required: true }
      - { name: descricao, label: Descrição, type: text, required: true }
      - { name: home, label: Mostrar na página inicial, type: boolean, default: false }

  # Árvore genealógica: uma entrada por pessoa. Filhos e o outro lado do casamento são deduzidos
  # automaticamente (src/arvore.ts), então basta indicar pai, mãe e cônjuge(s).
  - name: pessoas
    label: Árvore — pessoas
    type: collection
    path: src/content/pessoas
    format: yaml
    filename:
      # nome + data/hora da criação: dois "Antonio Camozzato" nunca colidem
      template: "{nome}-{sobrenome}-{year}{month}{day}{hour}{minute}{second}.yml"
      field: false
    operations:
      # renomear o arquivo quebraria as ligações de pai, mãe e cônjuges
      rename: false
    view:
      fields: [nome, sobrenome, nascimento]
      primary: nome
      sort: [nome, sobrenome]
      default: { sort: nome, order: asc }
    fields:
      - { name: nome, label: Nome, type: string, required: true, description: "Prenome(s). Ex.: Olimpia Maria" }
      - { name: sobrenome, label: Sobrenome, type: string, description: "Como a pessoa assinava: Camozzato, Camuzzato, Camossato…" }
      - name: sexo
        label: Sexo
        type: select
        required: true
        options:
          values:
            - { name: M, label: Masculino }
            - { name: F, label: Feminino }
      - { name: nascimento, label: Nascimento, type: string, description: "Ex.: 02/09/1839, 1903 ou c. 1880" }
      - { name: nascimento_local, label: Local de nascimento, type: string }
      - { name: falecimento, label: Falecimento, type: string, description: "Ex.: 04/05/1964 ou c. 1950" }
      - { name: falecimento_local, label: Local de falecimento, type: string }
      - name: pai
        label: Pai
        type: reference
        options: { collection: pessoas, value: "{path}", label: "{nome} {sobrenome} {nascimento}", search: "nome,sobrenome" }
      - name: mae
        label: Mãe
        type: reference
        options: { collection: pessoas, value: "{path}", label: "{nome} {sobrenome} {nascimento}", search: "nome,sobrenome" }
      - name: conjuges
        label: Cônjuges
        description: "Basta cadastrar o casamento em uma das duas pessoas."
        type: object
        list: true
        fields:
          - name: pessoa
            label: Cônjuge
            type: reference
            options: { collection: pessoas, value: "{path}", label: "{nome} {sobrenome} {nascimento}", search: "nome,sobrenome" }
          - { name: casamento, label: Data/local do casamento, type: string }
      - { name: foto, label: Foto, type: image }
      - { name: foto_alt, label: Descrição da foto, type: text }
      - { name: vivo, label: Pessoa viva, type: boolean, default: false, description: "Se marcado, o site mostra só o nome e o parentesco (sem datas, locais, notas nem foto)." }
      - { name: notas, label: Notas, type: text }
      - { name: fontes, label: Fontes, type: string, list: true, description: "De onde vem cada informação. Ex.: Lista do Vapor Hohenzollern, certidão, livro de José Camozzato" }
