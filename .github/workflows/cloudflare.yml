# Envia o site para a Cloudflare.
# - main      → site no ar (wrangler deploy)
# - conteudo  → prévia dos rascunhos (wrangler versions upload --preview-alias conteudo)
# Roda a cada push nessas branches e também é chamado pelos workflows de publicar e sincronizar,
# porque pushes feitos pelo próprio GitHub Actions não disparam outros workflows.
name: Enviar para a Cloudflare

on:
  push:
    branches: [main, conteudo]
    paths-ignore: ['README.md', '.pages.yml']
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

concurrency:
  group: cloudflare-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  enviar:
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.ref || github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fe1294590f59ffa2d11a1f94c1da3277
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Montar o site
        run: |
          npm ci
          npm run build

      - name: Enviar
        run: |
          MSG="$(git log -1 --format=%s | cut -c1-100)"
          if [ "$REF" = "main" ]; then
            npx wrangler deploy --message "$MSG"
            echo "Site no ar atualizado: https://familia-camozzato.infinitybuilder.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          else
            npx wrangler versions upload --preview-alias "$REF" --message "$MSG"
            echo "Prévia atualizada: https://$REF-familia-camozzato.infinitybuilder.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
